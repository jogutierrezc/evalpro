server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # Funciona tanto si el proxy (Traefik) quita el prefijo /evalpro como si no lo quita.
  rewrite ^/evalpro/(.*)$ /$1 last;
  location = /evalpro { return 301 /evalpro/; }

  # Un archivo inexistente en assets debe dar 404, nunca index.html (evita el error de MIME).
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
