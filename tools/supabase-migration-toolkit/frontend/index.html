<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Migration Toolkit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Supabase Migration Toolkit</h1>
            <p>Exporta y descarga migraciones de Supabase</p>
        </header>
        
        <div class="actions">
            <button class="btn primary" onclick="alert('Descargando migraciones...')">
                Descargar Todas las Migraciones
            </button>
        </div>
        
        <div class="list">
            <p>Coloca tus migraciones en la carpeta <code>migrations/</code> y estas aparecera aqui.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
